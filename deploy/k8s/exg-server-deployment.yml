apiVersion: apps/v1
kind: Deployment
metadata:
  name: exg-server
  namespace: exg
  labels:
    app: exg-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exg-server
  template:
    metadata:
      labels:
        app: exg-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: exg-server
          image: exg-server:latest
          ports:
            - name: http
              containerPort: 8080
            - name: ws
              containerPort: 8081
            - name: metrics
              containerPort: 9000
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: EXG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: exg-secrets
                  key: database-url
            - name: EXG_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: exg-secrets
                  key: redis-url
            - name: EXG_NATS_URL
              value: "nats://nats:4222"
          volumeMounts:
            - name: config
              mountPath: /etc/exg
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: exg-config
