port = 8080
ws_port = 8081
admin_port = 9090
node_id = 1

[database]
url = "postgres://exg:exg_dev_password@localhost:5433/exg"
max_connections = 20
min_connections = 2

[redis]
url = "redis://localhost:6379"
pool_size = 8

[nats]
url = "nats://localhost:4222"

[wal]
dir = "./data/wal"
segment_size_mb = 64
flush_interval_us = 1000
flush_every_n = 1000

[ringbuffer]
